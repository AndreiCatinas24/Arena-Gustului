name: Clone Arena Strigoilor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clone:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Arena Strigoilor source
        run: |
          git clone --depth 1 https://github.com/AndreiCatinas24/Gobblet-Trainer.git /tmp/arena-strigoilor

      - name: Replace target contents with source snapshot
        run: |
          rsync -a --delete --exclude '.git/' /tmp/arena-strigoilor/ ./

      - name: Commit exact copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clone current Arena Strigoilor into Arena Gustului" || exit 0
          git push origin main
