name: Import Arena Gustului food assets

on:
  push:
    branches: [main]
    paths:
      - '.asset-upload/READY'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode food assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/food
          for name in covrig-blue covrig-orange corn-blue corn-orange merdenea-blue merdenea-orange; do
            cat .asset-upload/$name/part-*.txt | tr -d '\n\r' | base64 -d > assets/food/$name.webp
          done

      - name: Commit assets and clean temporary importer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-upload
          rm -f .github/workflows/import-food-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Arena Gustului food assets"
          git push origin main
